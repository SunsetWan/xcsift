name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            arch: arm64
            build-path: arm64-apple-macosx/release
          - os: ubuntu-latest
            platform: linux-x64
            arch: x86_64
            build-path: x86_64-unknown-linux-gnu/release
            container: swift:6.1-jammy
            extra-flags: --static-swift-stdlib -Xlinker -lstdc++ -Xlinker -L/usr/lib/swift/linux

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux-x64'
        run: apt-get update && apt-get install -y curl build-essential

      - uses: actions/checkout@v6

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG_INPUT" \
            | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG_INPUT" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG_INPUT#v}" >> "$GITHUB_ENV"

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode 16 (macOS)
        if: matrix.platform == 'macos-arm64'
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Lint
        if: matrix.platform == 'macos-arm64'
        run: swift format lint --strict --recursive .

      - name: Run tests
        run: swift test

      - name: Replace version placeholder
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            sed -i '' "s/VERSION_PLACEHOLDER/$RELEASE_VERSION/g" Sources/xcsift/main.swift
          else
            sed -i "s/VERSION_PLACEHOLDER/$RELEASE_VERSION/g" Sources/xcsift/main.swift
          fi

      - name: Build release binary
        run: swift build -c release --arch ${{ matrix.arch }} ${{ matrix.extra-flags }}

      - name: Verify release binary version
        shell: bash
        run: |
          ACTUAL_VERSION="$(".build/${{ matrix.build-path }}/xcsift" --version)"
          if [ "$ACTUAL_VERSION" != "$RELEASE_VERSION" ]; then
            printf 'Expected version %s, got %s\n' "$RELEASE_VERSION" "$ACTUAL_VERSION" >&2
            exit 1
          fi

      - name: Create release archive
        shell: bash
        run: |
          tar -czf "xcsift-$RELEASE_TAG-${{ matrix.platform }}.tar.gz" \
            -C ".build/${{ matrix.build-path }}" xcsift

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xcsift-${{ matrix.platform }}
          path: xcsift-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/xcsift-*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-sunset.') }}
          fail_on_unmatched_files: true
